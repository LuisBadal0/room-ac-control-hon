name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install
        run: python -m pip install -e . -r packaging/requirements-build.txt
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: UI smoke checks
        run: |
          python tests/ui_smoke.py
          python tests/refresh_smoke.py
          python tests/desktop_smoke.py
      - name: Build portable release
        run: python tools/build_windows.py
      - uses: actions/upload-artifact@v7
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: releases/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: release
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published artifacts."
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip --title "Room AC Control for hOn $GITHUB_REF_NAME" --generate-notes
          fi
