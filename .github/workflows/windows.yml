name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.13'
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe tools/install_dependencies.py --build
      - name: Offline tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: UI smoke checks
        run: |
          .\.venv\Scripts\python.exe tests/ui_smoke.py
          .\.venv\Scripts\python.exe tests/refresh_smoke.py
          .\.venv\Scripts\python.exe tests/desktop_smoke.py
          .\.venv\Scripts\python.exe tests/window_header_smoke.py
      - name: Build portable release
        run: .\.venv\Scripts\python.exe tools/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error

  release:
    # Publishes a release when a merge to main carries a version that has no
    # release yet, or when a matching v* tag is pushed manually.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: release
      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive=$(ls release/Room-AC-Control-for-hOn-*-Windows-x64.zip)
          version=${archive##*/Room-AC-Control-for-hOn-}
          version=${version%-Windows-x64.zip}
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its published artifacts."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*.zip
      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip release/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Room AC Control for hOn $TAG" --generate-notes
