name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.13'
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe tools/install_dependencies.py --build
      - name: Offline tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: UI smoke checks
        run: |
          .\.venv\Scripts\python.exe tests/ui_smoke.py
          .\.venv\Scripts\python.exe tests/refresh_smoke.py
          .\.venv\Scripts\python.exe tests/desktop_smoke.py
          .\.venv\Scripts\python.exe tests/window_header_smoke.py
      - name: Build portable release
        run: .\.venv\Scripts\python.exe tools/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: |
            releases/*.zip
            releases/SHA256SUMS.txt
          if-no-files-found: error

  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: release
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*.zip
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its published artifacts."
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt --verify-tag --title "Room AC Control for hOn $GITHUB_REF_NAME" --generate-notes
          fi
