name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.13'
      - name: Install
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe tools/install_dependencies.py --build --dev
      - name: Lint and formatting
        run: |
          .\.venv\Scripts\python.exe -m ruff check src tests tools
          .\.venv\Scripts\python.exe -m ruff format --check src tests tools
      - name: Type checks
        run: .\.venv\Scripts\python.exe -m mypy
      - name: Offline tests
        run: .\.venv\Scripts\python.exe -m coverage run -m unittest discover -s tests -v
      - name: UI smoke checks
        # One command, so any failing check fails the step. Coverage also
        # measures each smoke check's own process.
        run: .\.venv\Scripts\python.exe -m coverage run tests/run_smoke.py
      - name: Coverage
        # The table goes to the run summary; below fail_under (pyproject.toml) fails.
        run: |
          .\.venv\Scripts\python.exe -m coverage combine -q
          .\.venv\Scripts\python.exe -m coverage report --format=markdown > coverage.md
          $code = $LASTEXITCODE
          Get-Content coverage.md | Add-Content $env:GITHUB_STEP_SUMMARY
          exit $code
      - name: Build portable release
        run: .\.venv\Scripts\python.exe tools/build_windows.py
      - name: Build installers (MSI and Setup.exe)
        # WiX comes from the pinned local tool in .config/dotnet-tools.json; the
        # runner's preinstalled .NET SDK runs it.
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: .\.venv\Scripts\python.exe tools/build_installers.py
      - name: Release notes
        # CHANGELOG.md's section for this version; fails if it is missing or empty.
        run: .\.venv\Scripts\python.exe tools/release_notes.py --output releases/RELEASE_NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: |
            releases/*.zip
            releases/*.msi
            releases/*-Setup.exe
            releases/SHA256SUMS.txt
            releases/RELEASE_NOTES.md
          if-no-files-found: error

  installer-update:
    # Installs the latest published release on a clean runner, updates it through the
    # app's own installer helper with this build's installer, then uninstalls it.
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        kind: [msi, setup]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: new
      - name: Download the latest published installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "$env:GITHUB_REPOSITORY" --dir old --pattern "*-Windows-x64.msi" --pattern "*-Windows-x64-Setup.exe"
      - name: Update an installed copy with the new ${{ matrix.kind }}
        run: |
          $pattern = if ('${{ matrix.kind }}' -eq 'msi') { '*-Windows-x64.msi' } else { '*-Windows-x64-Setup.exe' }
          $old = Get-ChildItem old -Filter $pattern | Select-Object -First 1
          $new = Get-ChildItem new -Filter $pattern | Select-Object -First 1
          $version = $new.Name -replace '^Room-AC-Control-for-hOn-(\d+\.\d+\.\d+)-Windows-x64.*$', '$1'
          python tools/check_installer_update.py --kind ${{ matrix.kind }} --old $old.FullName --new $new.FullName --version $version
          exit $LASTEXITCODE

  release:
    # Publishes a release when a merge to main carries a version that has no
    # release yet, or when a matching v* tag is pushed manually.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, installer-update]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Room-AC-Control-for-hOn-Windows-x64
          path: release
      - name: Decide whether to publish
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive=$(ls release/Room-AC-Control-for-hOn-*-Windows-x64.zip)
          version=${archive##*/Room-AC-Control-for-hOn-}
          version=${version%-Windows-x64.zip}
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version." >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping its published artifacts."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $tag."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - if: steps.decide.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.zip
            release/*.msi
            release/*-Setup.exe
      - name: Sign the in-app update manifest
        # The app installs an update only when update.json verifies against the
        # public key built into it, so a release is never published unsigned.
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.decide.outputs.tag }}
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "UPDATE_SIGNING_KEY is not set; refusing to publish an unsigned update." >&2
            exit 1
          fi
          archive=$(ls release/Room-AC-Control-for-hOn-*-Windows-x64.zip)
          python3 - "$archive" "${TAG#v}" "$TAG" > release/update.json <<'PY'
          import hashlib, json, os, sys
          path, version, tag = sys.argv[1:]
          def signed(file):
              return {"sha256": hashlib.sha256(open(file, "rb").read()).hexdigest(), "size": os.path.getsize(file)}
          manifest = {"schema": 1, "version": version, "tag": tag, "archive": os.path.basename(path), **signed(path)}
          # Installed copies update with the installer they came from; apps before 0.6.0 ignore these.
          stem = os.path.join(os.path.dirname(path), f"Room-AC-Control-for-hOn-{version}-Windows-x64")
          for field, file in (("installer", stem + ".msi"), ("setup", stem + "-Setup.exe")):
              manifest[field] = {"name": os.path.basename(file), **signed(file)}
          print(json.dumps(manifest, indent=2))
          PY
          key="$RUNNER_TEMP/update-signing-key.pem"
          (umask 077; printenv UPDATE_SIGNING_KEY > "$key")
          openssl dgst -sha256 -sign "$key" -sigopt rsa_padding_mode:pss -sigopt rsa_pss_saltlen:32 \
            -out release/update.json.sig release/update.json
          rm -f "$key"
          # Check against the public key committed at this exact commit (the app embeds the same key).
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/$GH_REPO/contents/packaging/update-signing-key.pub?ref=$GITHUB_SHA" > "$RUNNER_TEMP/update-signing-key.pub"
          openssl pkey -pubin -in "$RUNNER_TEMP/update-signing-key.pub" -out "$RUNNER_TEMP/update-signing-spki.pub"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/update-signing-spki.pub" -sigopt rsa_padding_mode:pss \
            -sigopt rsa_pss_saltlen:32 -signature release/update.json.sig release/update.json
      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" release/*.zip release/*.msi release/*-Setup.exe release/SHA256SUMS.txt \
            release/update.json release/update.json.sig \
            --target "$GITHUB_SHA" --title "Room AC Control for hOn $TAG" \
            --notes-file release/RELEASE_NOTES.md --generate-notes
